<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JYT · 项目集合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6dd5ed 100%);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #fff;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero {
    text-align: center;
    margin-bottom: 50px;
    max-width: 640px;
  }

  .hero h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    margin-bottom: 14px;
  }

  .hero p {
    font-size: 17px;
    opacity: 0.9;
    line-height: 1.7;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 960px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 28px;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.35);
  }

  .card .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .card .desc {
    font-size: 14px;
    opacity: 0.85;
    line-height: 1.6;
    flex: 1;
  }

  .card .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    font-size: 12px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .card .play {
    margin-top: 18px;
    align-self: flex-start;
    background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
    border-radius: 24px;
    padding: 9px 22px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(86, 171, 47, 0.45);
  }

  .footer {
    margin-top: 60px;
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
    line-height: 1.8;
  }

  .footer a { color: #fff; text-decoration: underline; }
</style>
</head>
<body>
  <div class="hero">
    <h1>🚀 JYT 项目集合</h1>
    <p>这里收录了我的各个网页小项目。点击任意卡片即可在线体验，所有项目均为纯前端、零依赖、开箱即玩。</p>
  </div>

  <div class="grid" id="grid">
    <!-- 项目卡片：以后新增项目，复制一个 <a class="card"> 块改内容即可 -->
    <a class="card" href="projects/snake/index.html">
      <div class="icon">🐍</div>
      <h2>贪吃蛇 Snake</h2>
      <div class="desc">现代毛玻璃风格的经典贪吃蛇。带渐变蛇身、发光食物、最高分记录，操作手感与渲染性能均经过优化。</div>
      <div class="tags">
        <span class="tag">Canvas</span>
        <span class="tag">原生 JS</span>
        <span class="tag">游戏</span>
      </div>
      <span class="play">开始游玩 →</span>
    </a>
  </div>

  <div class="footer">
    源码托管于 <a href="https://github.com/jjeerry-ai/JYT" target="_blank" rel="noopener">GitHub · jjeerry-ai/JYT</a><br>
    © 2026 Jerry_0923 · Apache-2.0 License
  </div>
</body>
</html>
